<!DOCTYPE html>
<html lang="en">
<head>
    
  
    <title>Multimedia Player</title>
</head>
<body>


    <h1><center>Multimedia Player</center></h1>
    <hr>
    <section>
       <h2>Audio Section</h2> 
       <audio controls>
                <source src="song.mp3" type="audio/mp3">
            </audio>
    </section>
    <hr>
    <section>
        <h2>Video Section</h2>
    </section>
    <video width="320" height="180" controls> 
                <source src="college.mp4" type="video/mp4"> 
             </video>



</body>
</html>

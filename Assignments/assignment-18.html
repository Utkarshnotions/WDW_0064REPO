<!DOCTYPE html>
<html>
<head>
    <title>ABC College Admission 2026</title>
    <style>
        header, footer {
            background-color: #202878;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            width: 75%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 5px;
        }

        th {
            background-color: #e8e8f3;
        }

        fieldset {
            margin-top: 15px;
        }

        input, select {
            margin-bottom: 10px;
        }

        textarea {
            width: 95%;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>

            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>

            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>₹90,000</td>
            </tr>

            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>₹45,000</td>
            </tr>
        </table>

        <form>
            <fieldset>
                <legend>Application Form</legend>

                Name:
                <br>
                <input type="text" size="30" required>
                <br>

                Email:
                <br>
                <input type="email" size="30" required>
                <br>

                Course:
                <br>
                <select>
                    <option>B.Tech CSE</option>
                    <option>BCA</option>
                </select>
                <br>

                Statement:
                <br>
                <textarea rows="4"></textarea>
                <br><br>

                <input type="submit" value="Apply">
            </fieldset>
        </form>
    </main>

    <footer>
        © 2026 ABC College
    </footer>

</body>
</html>

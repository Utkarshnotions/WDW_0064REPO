<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>
    <form>
        <input type="text" placeholder="Full name" required>
        <br><br>

        <input type="email" placeholder="you@college.edu" required>
        <br><br>

        <input type="tel" placeholder="10-digit mobile" pattern="[0-9]{10}" required>
        <br><br>

        <input type="password" placeholder="Min 6 characters" minlength="6" required>
        <br><br>

        <input type="number" placeholder="Age (17+)" min="17">
        <br><br>

        <input type="submit" value="Register">
    </form>
</body>
</html>

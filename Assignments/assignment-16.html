<!DOCTYPE html>
<html>
<head>
    <title>Course Feedback</title>
</head>
<body>
    <form>
        <label>Course:</label>
        <select name="course">
            <option>CSE</option>
            <option>ECE</option>
            <option>IT</option>
            <option>ME</option>
        </select>

        <br><br>

        <label>Feedback:</label>
        <br>
        <textarea name="feedback" rows="5" cols="45" placeholder="Write here..."></textarea>

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <button type="button">Click Me</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Multimedia</title>
</head>
<body>
    <h4>Image</h4>
    <img src="campus.jpg" alt="College campus" width="150" height="150">

    <h4>Video</h4>
    <video width="195" height="150" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h4>Audio</h4>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <h4>YouTube</h4>
    <iframe width="320" height="180"
        src="https://www.youtube.com/embed/VIDEO_ID">
    </iframe>
</body>
</html>

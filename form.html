<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking Form</title>
</head>
<body>

   
    <center>
        
        <h1>Hotel Room Booking Form</h1>

        <form>
            <table cellpadding="5">
                
                <tr>
                    <td align="right"><label for="full-name">Full Name:</label></td>
                    <td><input type="text" id="full-name" name="fullName" size="30"></td>
                </tr>
                
                
                <tr>
                    <td align="right"><label for="email">Email:</label></td>
                    <td><input type="email" id="email" name="email" size="30"></td>
                </tr>

                
                <tr>
                    <td align="right"><label for="phone">Phone:</label></td>
                    <td><input type="tel" id="phone" name="phone" size="30"></td>
                </tr>

                
                <tr>
                    <td align="right"><label for="check-in">Check-in Date:</label></td>
                    <td><input type="date" id="check-in" name="checkInDate" style="width: 215px;"></td>
                </tr>

              
                <tr>
                    <td align="right"><label for="check-out">Check-out Date:</label></td>
                    <td><input type="date" id="check-out" name="checkOutDate" style="width: 215px;"></td>
                </tr>

                
                <tr>
                    <td align="right"><label for="room-type">Room Type:</label></td>
                    <td>
                        <select id="room-type" name="roomType" style="width: 223px;">
                            <option value="single">Single Room</option>
                            <option value="double">Double Room</option>
                            <option value="suite">Suite</option>
                        </select>
                    </td>
                </tr>

               
                <tr>
                    <td align="right"><label for="guests">Number of Guests:</label></td>
                    <td><input type="number" id="guests" name="numberOfGuests" size="10" min="1"></td>
                </tr>

                
                <tr>
                    <td colspan="2" align="center">
                        <br>
                        <label for="special-requests">Special Requests:</label>
                    </td>
                </tr>
                
                
                <tr>
                    <td colspan="2" align="center">
                        <textarea id="special-requests" name="specialRequests" rows="5" cols="45"></textarea>
                    </td>
                </tr>

                
                <tr>
                    <td colspan="2" align="center">
                        <br>
                        <input type="submit" value="Book Now">
                        <input type="reset" value="Reset Form">
                    </td>
                </tr>
            </table>
        </form>
    </center>

</body>
</html>
